 href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>run.onclick=()=>{const a=Number(min.value),b=Number(max.value);if(!Number.isInteger(a)||!Number.isInteger(b)||a>b){result.textContent="Please enter valid integer limits.";return}const x=new Uint32Array(1);crypto.getRandomValues(x);result.textContent=String(a+x[0]%(b-a+1))};</script></body></html>
