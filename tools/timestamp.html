<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp Converter — NexaHub</title><meta name="description" content="Convert Unix timestamps and readable dates."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">◷</div><div><h1>Timestamp Converter</h1><p>Convert Unix timestamps and readable dates.</p></div></div><div class="tool-panel"><div class="tool-options"><div class="field"><label for="unix">Unix timestamp (seconds)</label><input id="unix" type="number"></div><div class="field"><label for="date">Date/time</label><input id="date" type="datetime-local"></div></div><div class="tool-actions"><button class="btn primary" id="toDate">Timestamp → Date</button><button class="btn secondary" id="toUnix">Date → Timestamp</button></div><div id="result" class="tool-result"></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>toDate.onclick=()=>{const n=Number(unix.value);if(!Number.isFinite(n)){result.textContent="Please enter a valid timestamp.";return}const d=new Date(n*1000);result.textContent=d.toString()+"\nISO: "+d.toISOString()};toUnix.onclick=()=>{if(!date.value){result.textContent="Please select a date.";return}result.textContent=String(Math.floor(new Date(date.value).getTime()/1000))};</script></body></html>
