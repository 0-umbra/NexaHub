<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Repeater — NexaHub</title><meta name="description" content="Repeat any text a chosen number of times."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">×</div><div><h1>Text Repeater</h1><p>Repeat any text a chosen number of times.</p></div></div><div class="tool-panel"><div class="field"><label for="text">Text</label><textarea id="text"></textarea></div><div class="field"><label for="count">Repetitions (1–1000)</label><input id="count" type="number" min="1" max="1000" value="5"></div><button class="btn primary" id="run">Repeat</button><div id="result" class="tool-result"></div><button class="btn secondary" id="copy">Copy result</button></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>run.onclick=()=>{if(!text.value){result.textContent="Please enter something first.";return}result.textContent=Array(Math.min(1000,Math.max(1,+count.value||1))).fill(text.value).join("\n")};copy.onclick=()=>ToolUI.copy(result.textContent);</script></body></html>
