<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Timer — NexaHub</title><meta name="description" content="Set a duration and run a simple countdown."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">◷</div><div><h1>Countdown Timer</h1><p>Set a duration and run a simple countdown.</p></div></div><div class="tool-panel"><div class="tool-options"><div class="field"><label for="min">Minutes</label><input id="min" type="number" min="0" value="5"></div><div class="field"><label for="sec">Seconds</label><input id="sec" type="number" min="0" max="59" value="0"></div></div><div id="result" class="tool-result" style="font-size:42px;text-align:center">05:00</div><div class="tool-actions"><button class="btn primary" id="start">Start</button><button class="btn secondary" id="reset">Reset</button></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>let left=0,timer=null;function show(){result.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`}start.onclick=()=>{if(timer)return;left=(+min.value||0)*60+(+sec.value||0);if(left<=0)return;show();timer=setInterval(()=>{left--;show();if(left<=0){clearInterval(timer);timer=null;NexaToast("Time is up!")}},1000)};reset.onclick=()=>{clearInterval(timer);timer=null;left=(+min.value||0)*60+(+sec.value||0);show()};</script></body></html>
