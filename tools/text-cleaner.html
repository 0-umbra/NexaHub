<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Cleaner — NexaHub</title><meta name="description" content="Remove extra spaces, empty lines, duplicate lines and trim text."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">✧</div><div><h1>Text Cleaner</h1><p>Remove extra spaces, empty lines, duplicate lines and trim text.</p></div></div><div class="tool-panel"><div class="field"><label for="text">Text</label><textarea id="text" placeholder="Paste messy text..."></textarea></div><div class="tool-actions"><button class="btn primary" id="spaces">Extra spaces</button><button class="btn secondary" id="empty">Empty lines</button><button class="btn secondary" id="dup">Duplicate lines</button><button class="btn secondary" id="trim">Trim lines</button><button class="btn secondary" id="all">Clean all</button><button class="btn secondary" id="copy">Copy</button></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>const t=document.querySelector("#text");const trim=()=>t.value.split(/\r?\n/).map(x=>x.trim()).join("\n");const empty=()=>trim().split("\n").filter(Boolean).join("\n");const dup=()=>[...new Set(empty().split("\n"))].join("\n");spaces.onclick=()=>t.value=t.value.replace(/[ \t]+/g," ").replace(/ +\n/g,"\n");empty.onclick=()=>t.value=empty();dup.onclick=()=>t.value=dup();trim.onclick=()=>t.value=trim();all.onclick=()=>{t.value=dup();t.value=t.value.replace(/[ \t]+/g," ").replace(/ +\n/g,"\n")};copy.onclick=()=>ToolUI.copy(t.value);</script></body></html>
