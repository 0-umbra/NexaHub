<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Format Converter — NexaHub</title><meta name="description" content="Convert browser-compatible images to PNG, JPEG or WebP locally."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">⇄</div><div><h1>Image Format Converter</h1><p>Convert browser-compatible images to PNG, JPEG or WebP locally.</p></div></div><div class="tool-panel"><div class="field"><label for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><div class="field"><label for="format">Output format</label><select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></div><button class="btn primary" id="run">Convert & Download</button><img id="preview" class="preview" alt="Selected image preview"></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>let img=new Image();file.onchange=e=>{const f=e.target.files[0];if(f){img.src=URL.createObjectURL(f);preview.src=img.src}};run.onclick=()=>{if(!img.src){NexaToast("Choose an image first");return}const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);const type=format.value,ext=type.split("/")[1];c.toBlob(b=>ToolUI.download(`nexahub-image.${ext==="jpeg"?"jpg":ext}`,b),type,.9)};</script></body></html>
