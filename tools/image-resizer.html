<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer — NexaHub</title><meta name="description" content="Resize images locally while keeping their aspect ratio."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">↗</div><div><h1>Image Resizer</h1><p>Resize images locally while keeping their aspect ratio.</p></div></div><div class="tool-panel"><div class="field"><label for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><p id="info" class="notice"></p><div class="tool-options"><div class="field"><label for="width">Width</label><input id="width" type="number"></div><div class="field"><label for="height">Height</label><input id="height" type="number"></div></div><label class="checkbox"><input id="lock" type="checkbox" checked> Lock aspect ratio</label><div class="tool-actions"><button class="btn primary" id="run">Resize & Download</button></div><img id="preview" class="preview" alt="Selected image preview"></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>let img=new Image(),ratio=1;file.onchange=e=>{const f=e.target.files[0];if(!f)return;img.src=URL.createObjectURL(f);img.onload=()=>{ratio=img.width/img.height;width.value=img.width;height.value=img.height;info.textContent=`Original: ${img.width} × ${img.height}px`;preview.src=img.src}};width.oninput=()=>{if(lock.checked)height.value=Math.round(+width.value/ratio)};height.oninput=()=>{if(lock.checked)width.value=Math.round(+height.value*ratio)};run.onclick=()=>{if(!img.src){NexaToast("Choose an image first");return}const c=document.createElement("canvas");c.width=Math.max(1,+width.value);c.height=Math.max(1,+height.value);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>ToolUI.download("nexahub-resized.png",b),"image/png")};</script></body></html>
