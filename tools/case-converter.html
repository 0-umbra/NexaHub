<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Converter — NexaHub</title><meta name="description" content="Convert text between common writing and developer cases."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">Tt</div><div><h1>Case Converter</h1><p>Convert text between common writing and developer cases.</p></div></div><div class="tool-panel"><div class="field"><label for="text">Text</label><textarea id="text" placeholder="Enter text..."></textarea></div><div class="tool-actions"><button class="btn primary" data-case="upper">UPPERCASE</button><button class="btn secondary" data-case="lower">lowercase</button><button class="btn secondary" data-case="title">Title Case</button><button class="btn secondary" data-case="sentence">Sentence case</button><button class="btn secondary" data-case="camel">camelCase</button><button class="btn secondary" data-case="snake">snake_case</button><button class="btn secondary" data-case="kebab">kebab-case</button></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>const t=document.querySelector("#text"),words=()=>t.value.trim().split(/\s+/).filter(Boolean);document.querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>{const w=words(),c=b.dataset.case;if(c==="upper")t.value=t.value.toUpperCase();if(c==="lower")t.value=t.value.toLowerCase();if(c==="title")t.value=t.value.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase());if(c==="sentence")t.value=t.value.toLowerCase().replace(/(^\s*|[.!?]\s+)(\w)/g,(m,a,x)=>a+x.toUpperCase());if(c==="camel")t.value=w.map((x,i)=>{x=x.replace(/[^a-zA-Z0-9]/g,"");return i?x[0]?.toUpperCase()+x.slice(1).toLowerCase():x.toLowerCase()}).join("");if(c==="snake")t.value=w.map(x=>x.replace(/[^a-zA-Z0-9]/g,"").toLowerCase()).join("_");if(c==="kebab")t.value=w.map(x=>x.replace(/[^a-zA-Z0-9]/g,"").toLowerCase()).join("-")});</script></body></html>
