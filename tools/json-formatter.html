<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter — NexaHub</title><meta name="description" content="Format, minify and validate JSON directly in your browser."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">{}</div><div><h1>JSON Formatter</h1><p>Format, minify and validate JSON directly in your browser.</p></div></div><div class="tool-panel"><div class="field"><label for="input">JSON</label><textarea id="input" placeholder='{"hello":"world"}'></textarea></div><div class="tool-actions"><button class="btn primary" id="format">Format</button><button class="btn secondary" id="minify">Minify</button><button class="btn secondary" id="validate">Validate</button><button class="btn secondary" id="copy">Copy</button><button class="btn secondary" id="clear">Clear</button></div><div id="result" class="tool-result"></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>function parse(){try{return JSON.parse(input.value)}catch(e){result.textContent="Invalid JSON. Please check your syntax.";return null}}format.onclick=()=>{const x=parse();if(x!==null)result.textContent=JSON.stringify(x,null,2)};minify.onclick=()=>{const x=parse();if(x!==null)result.textContent=JSON.stringify(x)};validate.onclick=()=>{const x=parse();if(x!==null)result.textContent="Valid JSON ✓"};copy.onclick=()=>ToolUI.copy(result.textContent);clear.onclick=()=>{input.value="";result.textContent=""};</script></body></html>
