<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor — NexaHub</title><meta name="description" content="Compress images locally with adjustable quality."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">◌</div><div><h1>Image Compressor</h1><p>Compress images locally with adjustable quality.</p></div></div><div class="tool-panel"><div class="field"><label for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><div class="field"><label for="quality">Quality: <span id="qv">80%</span></label><input id="quality" type="range" min="10" max="100" value="80"></div><button class="btn primary" id="run">Compress & Download</button><p id="info" class="notice"></p><img id="preview" class="preview" alt="Selected image preview"></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>let img=new Image(),size=0;file.onchange=e=>{const f=e.target.files[0];if(!f)return;size=f.size;img.src=URL.createObjectURL(f);img.onload=()=>{preview.src=img.src;info.textContent=`Original: ${(size/1024).toFixed(1)} KB`}};quality.oninput=()=>qv.textContent=quality.value+"%";run.onclick=()=>{if(!img.src){NexaToast("Choose an image first");return}const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);c.toBlob(b=>{info.textContent=`Output: ${(b.size/1024).toFixed(1)} KB`;ToolUI.download("nexahub-compressed.jpg",b)},"image/jpeg",+quality.value/100)};</script></body></html>
