<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch — NexaHub</title><meta name="description" content="Start, pause, reset and record laps."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">◉</div><div><h1>Stopwatch</h1><p>Start, pause, reset and record laps.</p></div></div><div class="tool-panel"><div id="result" class="tool-result" style="font-size:42px;text-align:center">00:00.000</div><div class="tool-actions" style="justify-content:center"><button class="btn primary" id="start">Start</button><button class="btn secondary" id="lap">Lap</button><button class="btn secondary" id="reset">Reset</button></div><div id="laps" class="tool-result"></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>let start=0,elapsed=0,timer=null;function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms%1000).padStart(3,"0")}`}function tick(){elapsed=Date.now()-start;result.textContent=fmt(elapsed)}start.onclick=()=>{if(timer){clearInterval(timer);timer=null;start.textContent="Start"}else{start=Date.now()-elapsed;timer=setInterval(tick,30);start.textContent="Pause"}};lap.onclick=()=>{if(timer)laps.textContent+=(laps.textContent?"\n":"")+fmt(elapsed)};reset.onclick=()=>{clearInterval(timer);timer=null;elapsed=0;result.textContent=fmt(0);laps.textContent="";start.textContent="Start"};</script></body></html>
