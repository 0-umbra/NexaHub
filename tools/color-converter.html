<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Converter — NexaHub</title><meta name="description" content="Convert HEX, RGB and HSL values with a live color preview."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">●</div><div><h1>Color Converter</h1><p>Convert HEX, RGB and HSL values with a live color preview.</p></div></div><div class="tool-panel"><div id="preview" class="color-preview"></div><div class="tool-options"><div class="field"><label for="hex">HEX</label><input id="hex" value="#9b5cff"></div><div class="field"><label for="rgb">RGB</label><input id="rgb" placeholder="155, 92, 255"></div><div class="field"><label for="hsl">HSL</label><input id="hsl" placeholder="264, 100%, 68%"></div></div><button class="btn primary" id="run">Convert</button><div id="result" class="tool-result"></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>function parseHex(x){x=x.replace("#","");if(x.length===3)x=x.split("").map(a=>a+a).join("");return/^[0-9a-f]{6}$/i.test(x)?[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4),16)]:null}function hsl(a){let[r,g,b]=a.map(x=>x/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){let d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)]}run.onclick=()=>{let x=parseHex(hex.value);if(!x){const a=rgb.value.split(",").map(Number);if(a.length===3&&a.every(n=>n>=0&&n<=255))x=a}if(!x){result.textContent="Enter a valid HEX or RGB color.";return}const H=hsl(x),hx="#"+x.map(n=>n.toString(16).padStart(2,"0")).join("");preview.style.background=hx;hex.value=hx;rgb.value=x.join(", ");hsl.value=H.join(", ")+"%";result.textContent=`HEX: ${hx}\nRGB: rgb(${x.join(", ")})\nHSL: hsl(${H[0]}, ${H[1]}%, ${H[2]}%)`};run.click();</script></body></html>
