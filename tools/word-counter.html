<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter — NexaHub</title><meta name="description" content="Count words, characters, sentences, paragraphs and reading time."><link rel="icon" href="../assets/icons/logo.svg"><link rel="stylesheet" href="../css/style.css"></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><header class="site-header"><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><nav class="desktop-nav"><a href="../">Home</a><a class="active" href="../tools.html">Tools</a><a href="../tools.html#categories">Categories</a><a href="../about.html">About</a></nav><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☼</button><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button></div></header><div class="mobile-menu" id="mobileMenu"><a href="../">Home</a><a href="../tools.html">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></div><main class="tool-shell"><div class="tool-head"><div class="tool-icon">Aa</div><div><h1>Word Counter</h1><p>Count words, characters, sentences, paragraphs and reading time.</p></div></div><div class="tool-panel"><div class="field"><label for="text">Your text</label><textarea id="text" placeholder="Start typing or paste text here..."></textarea></div><div class="metrics" id="metrics"></div><div class="tool-actions"><button class="btn secondary" id="clear">Clear</button><button class="btn secondary" id="copy">Copy text</button></div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>const text=document.querySelector("#text"),m=document.querySelector("#metrics");function update(){const v=text.value,w=v.trim()?v.trim().split(/\s+/).length:0,s=v.trim()?(v.match(/[.!?]+(?=\s|$)/g)||[]).length:0,p=v.trim()?v.trim().split(/\n\s*\n/).length:0,c=v.length,r=w?Math.max(1,Math.ceil(w/200)):0;m.innerHTML=[[""+w,"Words"],[""+c,"Characters"],[""+s,"Sentences"],[""+p,"Paragraphs"],[r+" min","Read time"]].map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}text.oninput=update;clear.onclick=()=>{text.value="";update()};copy.onclick=()=>ToolUI.copy(text.value);update();</script></body></html>
