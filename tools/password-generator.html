class="tool-result"></div><div class="strength"><i id="bar"></i></div><div id="strengthText" class="notice">Generated locally in your browser.</div></div><section class="related"><h2>More tools</h2><div class="tool-grid" id="related"></div></section></main><footer class="footer wrap"><div><a class="brand" href="../"><span class="brand-mark">✦</span><span>Nexa<span>Hub</span></span></a><p>Free tools for everyone.</p></div><div class="footer-links"><a href="../tools.html">Tools</a><a href="../privacy.html">Privacy</a></div><small>Built for the web.</small></footer><script src="../js/tools.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/tool-engine.js"></script><script>length.oninput=()=>lv.textContent=length.value;function rr(n){const a=new Uint32Array(n);crypto.getRandomValues(a);return a}run.onclick=()=>{let sets=[];if(upper.checked)sets.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");if(lower.checked)sets.push("abcdefghijklmnopqrstuvwxyz");if(numbers.checked)sets.push("0123456789");if(symbols.checked)sets.push("!@#$%^&*()_+-=[]{}");if(!sets.length){result.textContent="Select at least one character type.";return}const chars=sets.join(""),a=[];for(const s of sets)a.push(s[rr(1)[0]%s.length]);for(let i=a.length;i<+length.value;i++)a.push(chars[rr(1)[0]%chars.length]);for(let i=a.length-1;i>0;i--){const j=rr(1)[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}result.textContent=a.join("");const score=Math.min(100,+length.value*2+sets.length*10);bar.style.width=score+"%";strengthText.textContent=score>=80?"Strong password":score>=55?"Good password":"Weak password"};copy.onclick=()=>ToolUI.copy(result.textContent);run.click();</script></body></html>
